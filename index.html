<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TV Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #888; font: 16px sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<script>
// Private full-screen YouTube player.
// Use: ?k=<key>&v=<11-char video id>  [&list=<playlist id>]  [&start=<seconds>]
// Plays only when the key's SHA-256 matches KEY_HASH (the key itself is not in this file).
var KEY_HASH = "c7971b59c9cccd30116ce97ab08dc66a9eabe7daa23ae342e80569859ca540a4";
(async function () {
  var q = new URLSearchParams(location.search);
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(q.get("k") || ""));
  var hex = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  if (hex !== KEY_HASH) return;
  var v = (q.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
  var list = (q.get("list") || "").replace(/[^A-Za-z0-9_-]/g, "");
  var start = parseInt(q.get("start") || "0", 10) || 0;
  if (!v && !list) { document.body.innerHTML = "<p>No video.</p>"; return; }
  var p = new URLSearchParams({ autoplay: "1", rel: "0", playsinline: "1", iv_load_policy: "3",
                                 enablejsapi: "1", origin: location.origin });
  if (list) p.set("list", list);
  if (start > 0) p.set("start", String(start));
  var f = document.createElement("iframe");
  f.src = "https://www.youtube.com/embed/" + (v || "videoseries") + "?" + p.toString();
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.referrerPolicy = "strict-origin-when-cross-origin";
  f.allowFullscreen = true;
  document.body.appendChild(f);
})();
</script>
</body>
</html>
